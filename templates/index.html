<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>OGS Rating Tracker - Kata Web</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #343a40;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        .container {
            flex: 1;
            width: 90%;
            max-width: 1200px;
            padding: 20px;
            margin-top: 20px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .button-container button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .button-container button:hover {
            background-color: #0056b3;
        }

        canvas {
            margin: 20px 0;
        }

        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            width: 100%;
        }

        .extreme-ratings {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
        }

        .extreme-ratings h3 {
            margin-bottom: 10px;
        }

        .extreme-ratings p {
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>OGS Rating Tracker - Kata Web</h1>
    </header>
    
    <div class="container">
        <div class="button-container">
            <button onclick="loadCategory('overall')">Overall</button>
            <button onclick="loadCategory('9x9')">9x9</button>
            <button onclick="loadCategory('13x13')">13x13</button>
            <button onclick="loadCategory('19x19')">19x19</button>
        </div>

        <div class="extreme-ratings">
            <h3>Highest and Lowest Ratings</h3>
            <div id="extreme-ratings">
                <p>Overall: <span id="overall-highest">N/A</span> / <span id="overall-lowest">N/A</span></p>
                <p>9x9: <span id="9x9-highest">N/A</span> / <span id="9x9-lowest">N/A</span></p>
                <p>13x13: <span id="13x13-highest">N/A</span> / <span id="13x13-lowest">N/A</span></p>
                <p>19x19: <span id="19x19-highest">N/A</span> / <span id="19x19-lowest">N/A</span></p>
            </div>
        </div>
        
        <canvas id="chart" width="800" height="400"></canvas>
    </div>

    <footer>
        <p>&copy; 2025 Doublet Media. All Rights Reserved.</p>
        <p>Designed and Developed by Doublet Media</p>
    </footer>

    <script>
        const ctx = document.getElementById('chart').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Rating',
                    data: [],
                    borderColor: 'blue',
                    fill: false,
                    pointRadius: 5,
                    pointHoverRadius: 7
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.dataset.label || '';
                                return `${label}: ${context.parsed.y} @ ${context.label}`;
                            }
                        }
                    }
                }
            }
        });

        async function loadCategory(category) {
            const res = await fetch(`/history/${category}`);
            const data = await res.json();

            chart.data.labels = data.map(d => new Date(d.timestamp).toLocaleString());
            chart.data.datasets[0].data = data.map(d => d.rating);
            chart.data.datasets[0].label = `Rating: ${category}`;
            chart.update();
        }

        async function loadExtremeRatings() {
            const res = await fetch('/extreme-ratings');
            const data = await res.json();

            // Update the extreme ratings on the page
            document.getElementById('overall-highest').textContent = data.overall.highest || 'N/A';
            document.getElementById('overall-lowest').textContent = data.overall.lowest || 'N/A';
            document.getElementById('9x9-highest').textContent = data['9x9'].highest || 'N/A';
            document.getElementById('9x9-lowest').textContent = data['9x9'].lowest || 'N/A';
            document.getElementById('13x13-highest').textContent = data['13x13'].highest || 'N/A';
            document.getElementById('13x13-lowest').textContent = data['13x13'].lowest || 'N/A';
            document.getElementById('19x19-highest').textContent = data['19x19'].highest || 'N/A';
            document.getElementById('19x19-lowest').textContent = data['19x19'].lowest || 'N/A';
        }

        // Load 'overall' category by default
        loadCategory('overall');
        loadExtremeRatings();
    </script>
</body>
</html>
